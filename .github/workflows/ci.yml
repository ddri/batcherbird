name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Desktop Workflow and Rust Checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check --locked --workspace

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Sampler audio analyzer regressions
        run: |
          python3 scripts/test-sampler-render.py
          python3 scripts/test-decent-render.py

      - name: Packaging rollback and metadata regressions
        run: |
          bash scripts/test-package-macos.sh
          bash scripts/test-verify-macos-package.sh
          python3 scripts/test-package-manifest.py

  package-macos:
    name: Package macOS App & DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Capture source revision
        id: candidate-source
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"

      - name: Package macOS App and DMG
        run: ./scripts/package-macos.sh

      - name: Audit copied standalone app and DMG
        run: |
          copied_package="$(mktemp -d)"
          trap 'rm -rf "$copied_package"' EXIT
          ditto dist/Batcherbird.app "$copied_package/Batcherbird.app"
          bash scripts/verify-macos-package.sh "$copied_package/Batcherbird.app" dist/Batcherbird.dmg

      - name: Write candidate provenance
        env:
          SOURCE_REVISION: ${{ steps.candidate-source.outputs.revision }}
        run: |
          python3 scripts/package-manifest.py dist/Batcherbird.app dist/Batcherbird.dmg dist/Batcherbird-manifest.json --revision "$SOURCE_REVISION"

      - name: Upload hardware acceptance candidate
        uses: actions/upload-artifact@v7
        with:
          name: batcherbird-macos-candidate-${{ steps.candidate-source.outputs.revision }}
          path: |
            dist/Batcherbird.dmg
            dist/Batcherbird-manifest.json
          if-no-files-found: error
          retention-days: 14

  rust-linux:
    name: Rust Linux Build (core + vizia)
    runs-on: ubuntu-latest
    continue-on-error: true  # Linux support is experimental
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxdo-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libasound2-dev

      - name: Check (core + vizia)
        run: cargo check --locked -p batcherbird-core -p batcherbird-vizia

      - name: Clippy (core + vizia)
        run: cargo clippy --locked -p batcherbird-core -p batcherbird-vizia --all-targets

      - name: Test (core + vizia)
        run: cargo test --locked -p batcherbird-core -p batcherbird-vizia

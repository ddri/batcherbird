name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # TODO(release): The macOS release build previously packaged the deprecated
  # Tauri GUI crate (crates/batcherbird-gui) into a .dmg. That crate has been
  # removed. A new release job that builds and packages the VIZIA app
  # (crates/batcherbird-vizia) will be implemented in the release-pipeline
  # follow-up task. Until then this workflow only performs a placeholder build
  # so it does not reference the deleted crate's paths.
  build-macos:
    name: Build & Release macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-

      - name: Package macOS App & DMG
        run: ./scripts/package-macos.sh

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Batcherbird.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

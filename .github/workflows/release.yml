name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Builds the current Vizia application through scripts/package-macos.sh.
  # A v* tag publishes a DMG: complete docs/RELEASE_CHECKLIST.md before tagging.
  # Signing/notarization are opt-in local steps documented in DISTRIBUTION.md.
  # This workflow has no developer credentials and publishes a local unsigned
  # candidate; an upload does not establish hardware or OS compatibility.
  build-macos:
    name: Build & Release macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-

      - name: Package macOS App & DMG
        run: ./scripts/package-macos.sh

      - name: Audit package
        run: bash scripts/verify-macos-package.sh dist/Batcherbird.app dist/Batcherbird.dmg

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Batcherbird.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

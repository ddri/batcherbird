[package]
name = "app"
version = "0.1.0"
description = "BatcherBird - Professional auto-sampling tool for hardware synthesizers"
authors = ["David Ryan"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/ddri/batcherbird"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.6.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
batcherbird-core = { path = "../../batcherbird-core" }
midir = "0.10"
rtrb = "0.3"
tokio = { version = "1.35", features = ["time"] }
dirs = "5.0"
cpal = "0.16.0"
regex = "1.0"
hound = "3.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
